<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Santa bowls. The gnomes are the pins. A free ten-frame bowling game at Santa's Workshop.">
<meta name="theme-color" content="#0a1030">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gnome Bowling">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<title>Gnome Bowling</title>
<style>
  html,body{margin:0;height:100%;background:#0a1030;overflow:hidden;overscroll-behavior:none;-webkit-touch-callout:none}
  #wrap{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;flex:none;touch-action:none;cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Gnome Bowling game"></canvas></div>
<script>
/* Gnome Bowling — a single-file, no-dependency canvas game.
   All art is drawn in code and all sound is synthesized, so this one file
   runs straight from disk (double-click) or from any web server / iframe. */
(function(){
'use strict';

// ───────────────────────── basics ─────────────────────────
var W=960,H=640,TAU=Math.PI*2;
var cv=document.getElementById('game'),ctx=cv.getContext('2d');
var bgc=document.createElement('canvas'),bgDirty=true,scale=1;
var FONT='"Trebuchet MS","Segoe UI",Verdana,sans-serif';
var HEAVY='"Arial Black",Impact,"Trebuchet MS",sans-serif';
function rand(a,b){return a+Math.random()*(b-a);}
function pick(a){return a[(Math.random()*a.length)|0];}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function seg(t,a,b){return clamp((t-a)/(b-a),0,1);}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}

// On a phone held upright the game is drawn sideways so it still fills the screen;
// the player just turns the phone, exactly like a landscape-only app.
var TOUCH=!!(window.matchMedia&&window.matchMedia('(pointer:coarse)').matches),sideways=false;
function resize(){
  var vw=window.innerWidth,vh=window.innerHeight;
  sideways=TOUCH&&vh>vw*1.15;
  var css=sideways?Math.min(vh,vw*W/H):Math.min(vw,vh*W/H);
  if(css<50)css=50;
  cv.style.width=css+'px';cv.style.height=(css*H/W)+'px';cv.style.transform=sideways?'rotate(90deg)':'none';
  var dpr=Math.min(window.devicePixelRatio||1,2);
  scale=css*dpr/W;
  cv.width=Math.round(W*scale);cv.height=Math.round(H*scale);
  bgc.width=cv.width;bgc.height=cv.height;bgDirty=true;
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,250);});

// drawing helpers (g = a 2d context)
function ell(g,x,y,rx,ry,fill,rot){g.beginPath();g.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU);if(fill)g.fillStyle=fill;g.fill();}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function poly(g,pts,fill){g.beginPath();g.moveTo(pts[0],pts[1]);for(var i=2;i<pts.length;i+=2)g.lineTo(pts[i],pts[i+1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}}
function line(g,x1,y1,x2,y2,col,w){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.strokeStyle=col;g.lineWidth=w;g.lineCap='round';g.stroke();}
function txt(g,s,x,y,size,fill,o){o=o||{};g.font=(o.weight||'bold')+' '+size+'px '+(o.font||FONT);g.textAlign=o.align||'center';g.textBaseline=o.base||'middle';
  if(o.stroke){g.lineWidth=o.sw||4;g.strokeStyle=o.stroke;g.lineJoin='round';g.strokeText(s,x,y);}g.fillStyle=fill;g.fillText(s,x,y);}
function star(g,x,y,r,fill,rot){g.beginPath();for(var i=0;i<10;i++){var a=(rot||0)+i*TAU/10-Math.PI/2,q=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}g.closePath();g.fillStyle=fill;g.fill();}
function heart(g,x,y,s,fill){g.beginPath();g.moveTo(x,y+s*.9);g.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.6,y-s*1.1,x,y-s*.3);g.bezierCurveTo(x+s*.6,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9);g.fillStyle=fill;g.fill();}

// ───────────────────────── lane projection ─────────────────────────
// Lane space: x across (0 = centre), y down-lane (0 = foul line). Units ≈ 1 inch across.
var K=0.00417,S0=11,VY=-60,BASE=545,CX=480;
function P(x,y){var s=1/(1+K*y);return {x:CX+x*S0*s,y:VY+(BASE-VY)*s,s:s};}
var PIN_R=3,BALL_R=3.2,LANE_HALF=21,DECK_Y=160,ROW_DY=15,PIN_DX=12,PIT_Y=218,AIM_MAX=0.22,SANTA_Y=-14,SANTA_MAX=17;
var BM=5,PM=1,KNOCK_T=26,DOWN_R=.75,PFR=1.7,PP_E=1.75;

// ───────────────────────── audio (all synthesized) ─────────────────────────
var Snd=(function(){
  var ac=null,master=null,musicG=null,muted=false,noiseBuf=null,rollSrc=null,rollG=null,musTimer=null,musNext=0,musIdx=0,lastPin=0;
  try{muted=localStorage.getItem('gnomebowl_mute')==='1';}catch(e){}
  function init(){
    if(ac){if(ac.state==='suspended')ac.resume();return;}
    try{
      var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      ac=new AC();master=ac.createGain();master.gain.value=muted?0:0.9;master.connect(ac.destination);
      musicG=ac.createGain();musicG.gain.value=0.5;musicG.connect(master);
      noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      musNext=ac.currentTime+0.3;musTimer=setInterval(musicTick,120);
    }catch(e){ac=null;}
  }
  function tone(f,d,o){if(!ac)return;o=o||{};var t=ac.currentTime+(o.at||0),os=ac.createOscillator(),g=ac.createGain();
    os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+d);
    var v=o.vol||0.2;g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+(o.att||0.012));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    os.connect(g);g.connect(o.dest||master);os.start(t);os.stop(t+d+0.05);}
  function noise(d,o){if(!ac)return;o=o||{};var t=ac.currentTime+(o.at||0),s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=noiseBuf;s.loop=true;f.type=o.ft||'lowpass';f.frequency.setValueAtTime(o.f||1200,t);if(o.fto)f.frequency.exponentialRampToValueAtTime(o.fto,t+d);
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(o.vol||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f);f.connect(g);g.connect(o.dest||master);s.start(t,Math.random()*0.5);s.stop(t+d+0.05);}
  // Jingle Bells (public domain, 1857) — [midi note, beats]
  var MEL=[[64,1],[64,1],[64,2],[64,1],[64,1],[64,2],[64,1],[67,1],[60,1.5],[62,.5],[64,4],
           [65,1],[65,1],[65,1.5],[65,.5],[65,1],[64,1],[64,1],[64,.5],[64,.5],[64,1],[62,1],[62,1],[64,1],[62,2],[67,2],
           [64,1],[64,1],[64,2],[64,1],[64,1],[64,2],[64,1],[67,1],[60,1.5],[62,.5],[64,4],
           [65,1],[65,1],[65,1.5],[65,.5],[65,1],[64,1],[64,1],[64,.5],[64,.5],[67,1],[67,1],[65,1],[62,1],[60,3],[0,1]];
  var BASS=[48,48,48,48,53,48,50,55,48,48,48,48,53,48,55,48],BEAT=0.27,musBeat=0;
  function mf(m){return 440*Math.pow(2,(m-69)/12);}
  function musicTick(){if(!ac||ac.state!=='running')return;
    while(musNext<ac.currentTime+0.35){
      var n=MEL[musIdx],at=musNext-ac.currentTime,dur=n[1]*BEAT;
      if(n[0])tone(mf(n[0]+12),dur*0.95,{type:'triangle',vol:0.07,at:at,dest:musicG});
      // bass + sleigh bells on the beat grid
      var b0=Math.ceil(musBeat-1e-6),b1=musBeat+n[1];
      for(var b=b0;b<b1-1e-6;b++){var bt=at+(b-musBeat)*BEAT;
        if(b%2===0)tone(mf(BASS[((b/4)|0)%16]),BEAT*1.6,{type:'sine',vol:0.09,at:bt,dest:musicG});
        noise(0.06,{ft:'highpass',f:7000,vol:b%2?0.02:0.035,at:bt,dest:musicG});}
      musBeat+=n[1];musNext+=dur;musIdx++;if(musIdx>=MEL.length){musIdx=0;musBeat=0;}
    }}
  var api={
    init:init,
    get muted(){return muted;},
    toggle:function(){muted=!muted;if(master)master.gain.value=muted?0:0.9;try{localStorage.setItem('gnomebowl_mute',muted?'1':'0');}catch(e){}},
    click:function(){tone(700,0.07,{type:'square',vol:0.08});tone(1050,0.09,{type:'square',vol:0.06,at:0.05});},
    tick:function(){tone(900,0.04,{type:'square',vol:0.04});},
    whoosh:function(){noise(0.3,{ft:'bandpass',f:500,fto:2500,vol:0.2});},
    boing:function(){tone(180,0.4,{type:'sine',to:520,vol:0.22});tone(260,0.3,{type:'triangle',to:700,vol:0.1,at:0.08});},
    rollStart:function(v){if(!ac)return;api.rollStop();rollSrc=ac.createBufferSource();rollSrc.buffer=noiseBuf;rollSrc.loop=true;
      var f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=180+v*1.6;rollG=ac.createGain();rollG.gain.value=0.0001;
      rollG.gain.linearRampToValueAtTime(0.22,ac.currentTime+0.15);rollSrc.connect(f);f.connect(rollG);rollG.connect(master);rollSrc.start();},
    rollStop:function(){if(rollSrc&&ac){try{rollG.gain.cancelScheduledValues(ac.currentTime);rollG.gain.setValueAtTime(rollG.gain.value,ac.currentTime);rollG.gain.linearRampToValueAtTime(0.0001,ac.currentTime+0.12);rollSrc.stop(ac.currentTime+0.15);}catch(e){}rollSrc=null;}},
    pin:function(j){if(!ac)return;var now=ac.currentTime;if(now-lastPin<0.035)return;lastPin=now;var v=clamp(j/400,0.05,0.3);
      noise(0.09,{ft:'bandpass',f:rand(1400,2600),vol:v});tone(rand(500,900),0.09,{type:'triangle',to:260,vol:v*0.8});
      if(Math.random()<0.35)tone(rand(900,1500),0.12,{type:'sine',to:rand(500,800),vol:0.06,at:0.03});},
    gutter:function(){noise(0.25,{f:300,vol:0.3});tone(110,0.25,{type:'sine',to:70,vol:0.2});},
    strike:function(){[523,659,784,1047,1319,1568].forEach(function(f,i){tone(f,0.3,{type:'square',vol:0.09,at:i*0.08});tone(f*1.5,0.3,{type:'triangle',vol:0.07,at:i*0.08});});
      for(var i=0;i<6;i++)noise(0.08,{ft:'highpass',f:6000,vol:0.08,at:0.5+i*0.07});},
    spare:function(){[523,659,784,1047].forEach(function(f,i){tone(f,0.25,{type:'triangle',vol:0.14,at:i*0.09});});},
    sad:function(){[[233,0.3],[220,0.3],[208,0.3],[196,0.7]].reduce(function(at,n){tone(n[0],n[1],{type:'sawtooth',vol:0.1,at:at,to:n[0]*0.94});return at+n[1]*0.95;},0);},
    raspberry:function(at){if(!ac)return;var t=ac.currentTime+(at||0),os=ac.createOscillator(),g=ac.createGain(),lfo=ac.createOscillator(),lg=ac.createGain(),env=ac.createGain();
      os.type='sawtooth';os.frequency.setValueAtTime(95,t);os.frequency.linearRampToValueAtTime(70,t+0.7);lfo.type='square';lfo.frequency.value=31;lg.gain.value=0.5;g.gain.value=0.5;
      lfo.connect(lg);lg.connect(g.gain);os.connect(g);g.connect(env);env.gain.setValueAtTime(0.0001,t);env.gain.linearRampToValueAtTime(0.22,t+0.03);env.gain.setValueAtTime(0.22,t+0.55);env.gain.exponentialRampToValueAtTime(0.0001,t+0.75);
      env.connect(master);os.start(t);lfo.start(t);os.stop(t+0.8);lfo.stop(t+0.8);},
    nyah:function(){[[784,.18],[659,.18],[880,.18],[784,.18],[659,.3]].reduce(function(at,n){tone(n[0],n[1],{type:'square',vol:0.07,at:at});return at+n[1];},0);},
    giggle:function(){for(var i=0;i<7;i++)tone(rand(900,1500),0.07,{type:'sine',vol:0.09,at:i*0.085,to:rand(700,1100)});},
    hoho:function(){[150,130,110].forEach(function(f,i){tone(f,0.22,{type:'sawtooth',vol:0.13,at:i*0.26,to:f*0.8});tone(f*2,0.2,{type:'sine',vol:0.06,at:i*0.26});});},
    jig:function(){[659,784,880,784,659,784,880,1047].forEach(function(f,i){tone(f,0.1,{type:'square',vol:0.05,at:i*0.11});});},
    pop:function(){tone(400,0.08,{type:'sine',to:900,vol:0.15});},
    splat:function(){noise(0.18,{f:900,fto:200,vol:0.3});tone(160,0.12,{type:'sine',to:80,vol:0.15});},
    honk:function(){tone(310,0.16,{type:'square',vol:0.09});tone(310,0.22,{type:'square',vol:0.09,at:0.2});},
    chirp:function(){for(var i=0;i<3;i++)tone(2600,0.07,{type:'sine',to:3600,vol:0.06,at:i*0.13});},
    whee:function(){tone(500,0.6,{type:'sine',to:1500,vol:0.08});noise(0.7,{ft:'highpass',f:3000,vol:0.04});},
    snore:function(){noise(0.5,{f:220,vol:0.1});tone(70,0.5,{type:'sawtooth',vol:0.05,to:55});},
    thud:function(){tone(120,0.12,{type:'sine',to:60,vol:0.2});}
  };
  return api;
})();

// ───────────────────────── game state ─────────────────────────
var time=0,phase='title',pt=0,diff='easy';
var SPEED={easy:{aim:1.5,pow:2.1},hard:{aim:4.6,pow:6.8}};
var frames=[],fi=0,pins=[],ball=null,rackCount=10,sweepFull=false,sweepDone=false,gameOverNext=false;
var santa={x:0,tx:0,mode:'idle',t:0,hasBall:true,splat:0,released:false};
var shot={aim:0,power:0,kid:false},aimPh=0,powPh=0;
var keys={},idleT=0,anticT=3,ambientT=4;
var particles=[],floaters=[],bubbles=[],shots=[],snow=[],banner=null;
var best={easy:0,hard:0};
try{var bs=JSON.parse(localStorage.getItem('gnomebowl_best')||'{}');best.easy=bs.easy||0;best.hard=bs.hard||0;}catch(e){}
var HATS=['#d62828','#2a9d4a','#2563c9','#8e44ad','#e67e22','#12a5a5','#e0457b','#c9a30a','#b0183a','#3b4cc0'];
var COATS=['#2e6fb7','#b03a2e','#3a8f4d','#7a4a9e','#2f8f9a','#b5562a','#40609a','#8a3b6b','#4a7a2a','#a8322d'];
var TAUNTS=['Nyah nyah!','Missed me!','Yoo-hoo, Santa!','Ho ho NO!','Butterfingers!','Nice try, Tubby!','Can’t touch this!','Smell ya later!','Is that all you got?','My granny bowls better!','Over here, Beardy!'];
var SIGNS=['MISS!','BOO!','LOL','NOPE','HA HA','0/10','ZZZ…','WEAK!'];
var SANTA_GRUMBLE=['Hey!','Naughty list!','Why, you little…','Ho ho HEY!','Coal for you!','Rude!'];

function newRack(drop){
  pins=[];var i=0;
  for(var r=0;r<4;r++)for(var j=0;j<=r;j++){
    var x=(j-r/2)*PIN_DX,y=DECK_Y+r*ROW_DY;
    pins.push({idx:i,hx:x,hy:y,x:x,y:y,vx:0,vy:0,state:'stand',z:drop?2.2+i*0.25:0,zv:0,ang:0,angV:0,seed:Math.random()*10,
      hat:HATS[i%HATS.length],coat:COATS[(i*3+1)%COATS.length],tip:rand(-.08,.08),act:null,fade:1,landed:!drop});
    i++;
  }
}
function standing(){return pins.filter(function(p){return p.state==='stand';});}

function startGame(d){
  diff=d;frames=[];for(var i=0;i<10;i++)frames.push([]);fi=0;gameOverNext=false;
  newRack(true);santa.x=santa.tx=0;beginRoll();
}
function beginRoll(){
  pins=pins.filter(function(p){return p.state==='stand';});
  rackCount=pins.length;ball=null;phase='position';pt=0;idleT=0;
  santa.mode='idle';santa.t=0;santa.hasBall=true;santa.released=false;
  anticT=rand(1.2,3.5);banner=null;
  cr.rl.act=cr.rr.act=null;
}
function toTitle(){phase='title';pt=0;newRack(false);ball=null;santa.mode='idle';santa.hasBall=true;anticT=1.5;banner=null;Snd.rollStop();}

// scoring ---------------------------------------------------------------
function calcScores(fr){
  var rolls=[],i,out=[],total=0,pend=false;for(i=0;i<fr.length;i++)rolls=rolls.concat(fr[i]);
  i=0;
  for(var f=0;f<10;f++){var F=fr[f],v=null;
    if(!F||!F.length||pend){out.push(null);pend=true;continue;}
    if(f<9){
      if(F[0]===10){if(rolls[i+1]!=null&&rolls[i+2]!=null)v=10+rolls[i+1]+rolls[i+2];i+=1;}
      else if(F.length<2){i+=1;}
      else if(F[0]+F[1]===10){if(rolls[i+2]!=null)v=10+rolls[i+2];i+=2;}
      else{v=F[0]+F[1];i+=2;}
    }else{
      if(F.length===3||(F.length===2&&F[0]+F[1]<10))v=F[0]+(F[1]||0)+(F[2]||0);
    }
    if(v==null){pend=true;out.push(null);}else{total+=v;out.push(total);}
  }
  return out;
}
function totalScore(){var s=calcScores(frames),t=0;for(var i=0;i<10;i++)if(s[i]!=null)t=s[i];return t;}
function marks(f){var F=frames[f],m=[];
  if(f<9){if(F[0]===10)return ['','X'];
    if(F.length>0)m.push(F[0]===0?'-':''+F[0]);
    if(F.length>1)m.push(F[0]+F[1]===10?'/':(F[1]===0?'-':''+F[1]));return m;}
  for(var i=0;i<F.length;i++){var v=F[i],prev=i>0?F[i-1]:null;
    var fresh=(i===0)||(i===1&&F[0]===10)||(i===2&&(F[1]===10||(F[0]!==10&&F[0]+F[1]===10)));
    if(fresh)m.push(v===10?'X':(v===0?'-':''+v));
    else m.push(prev+v===10?'/':(v===0?'-':''+v));}
  return m;
}

// ───────────────────────── physics ─────────────────────────
function knock(p,j){
  if(p.state==='stand'){p.state='down';p.act=null;p.zv=clamp(j*0.012,0.5,2.2);p.z=0.01;p.angV=(Math.random()<.5?-1:1)*(5+Math.min(j*0.05,12));
    var q=P(p.x,p.y);for(var i=0;i<5;i++)particles.push({x:q.x,y:q.y-10,vx:rand(-90,90),vy:rand(-160,-40),g:300,life:0,max:rand(.3,.6),size:rand(2,5),color:'#fff',shape:'c'});}
  if(!simMode)Snd.pin(j);
}
var simMode=false;
function physStep(dt){
  var b=ball,i,j,p;
  if(b&&!b.done){
    if(b.kid&&!b.gutter)b.vx+=Math.sin(b.t*2.3+b.wob)*7*dt;
    b.t+=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.rot+=Math.hypot(b.vx,b.vy)*dt/BALL_R;
    var sp=Math.hypot(b.vx,b.vy);if(sp<25){b.vy+=40*dt;}
    if(!b.gutter&&Math.abs(b.x)>LANE_HALF&&b.y<PIT_Y){b.gutter=true;b.gx=(b.x>0?1:-1)*23.3;b.vy=Math.max(sp,40);b.vx=0;if(!simMode)Snd.gutter();}
    if(b.gutter)b.x=lerp(b.x,b.gx,Math.min(1,dt*14));
    if(b.y>PIT_Y+6||b.y<-45||Math.abs(b.x)>45)b.done=true;
    if(!b.gutter&&!b.done)for(i=0;i<pins.length;i++){p=pins[i];if(p.state==='gone')continue;
      var dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy),R=BALL_R+PIN_R;if(d>=R||d===0)continue;
      var nx=dx/d,ny=dy/d,vn=(p.vx-b.vx)*nx+(p.vy-b.vy)*ny,ov=R-d;

      if(vn<0){var J=-(1.7)*vn/(1/BM+1/PM);p.vx+=J/PM*nx;p.vy+=J/PM*ny;b.vx-=J/BM*nx;b.vy-=J/BM*ny;knock(p,J);}
    }
  }
  for(i=0;i<pins.length;i++){var a=pins[i];if(a.state==='gone')continue;
    for(j=i+1;j<pins.length;j++){var c=pins[j];if(c.state==='gone')continue;
      var as=a.state==='stand',cs=c.state==='stand';if(as&&cs)continue;
      var ddx=c.x-a.x,ddy=c.y-a.y,dd=Math.hypot(ddx,ddy),RR=(as?PIN_R:PIN_R+DOWN_R)+(cs?PIN_R:PIN_R+DOWN_R);if(dd>=RR||dd===0)continue;

      if(as){c.x+=mx*o2;c.y+=my*o2;}else if(cs){a.x-=mx*o2;a.y-=my*o2;}else{a.x-=mx*o2*.5;a.y-=my*o2*.5;c.x+=mx*o2*.5;c.y+=my*o2*.5;}

}

function resolveRoll(){
  var n=rackCount-standing().length,F=frames[fi];
  var strike=(rackCount===10&&n===10),spare=(!strike&&rackCount<10&&n===rackCount),gut=ball&&ball.gutter&&n===0;
  F.push(n);phase='react';pt=0;Snd.rollStop();
  var paddle=strike?'X':spare?'/':''+n;
  cr.rl.paddle=cr.rr.paddle=paddle;
  var sq=P(santa.x,SANTA_Y);
  if(strike){banner={text:'STRIKE!',t:0,color:'#ffd23f'};Snd.strike();Snd.hoho();santa.mode='cheer';confetti(90);cr.rl.act=cr.rr.act='cheer';cr.snowman.act='head';cr.snowman.at=0;say(sq.x-70,sq.y-250,'HO HO HO!',2);}
  else if(spare){banner={text:'SPARE!',t:0,color:'#7dffb0'};Snd.spare();santa.mode='cheer';confetti(40);cr.rl.act=cr.rr.act='paddle';}
  else if(gut){banner={text:'GUTTER BALL!',t:0,color:'#ff6b6b'};Snd.sad();santa.mode='sad';cr.rl.act=cr.rr.act='laugh';
    setTimeout(Snd.giggle,500);if(Math.random()<.5){reactAll('moon',2.3,'Thanks for the breeze!');Snd.raspberry(.4);}else reactAll('laugh',2.3,pick(TAUNTS));}
  else if(n===0){banner={text:'MISSED!',t:0,color:'#ff9f6b'};Snd.sad();santa.mode='sad';cr.rl.act=cr.rr.act='paddle';reactAll(pick(['tongue','laugh','dance']),2.2,pick(TAUNTS));Snd.giggle();}
  else{banner={text:n+(n===1?' GNOME!':' GNOMES!'),t:0,color:'#ffffff'};cr.rl.act=cr.rr.act='paddle';
    if(n>=7){santa.mode='cheer';}

  cr.rl.at=cr.rr.at=0;
  // decide what happens next
  var L=F.length;gameOverNext=false;sweepFull=false;

    if(strike||L===2){fi++;sweepFull=true;}
  }else{
    if(L===1){sweepFull=strike;}

    else gameOverNext=true;
  }

}

// ───────────────────────── update ─────────────────────────
function update(dt){
  time+=dt;pt+=dt;var i;
  // snow
  for(i=0;i<snow.length;i++){var f=snow[i];f.y+=f.v*dt;f.x+=Math.sin(time*f.w+f.p)*f.d*dt+8*dt;if(f.y>H+5){f.y=-5;f.x=rand(-20,W);}if(f.x>W+10)f.x=-10;}
  for(i=particles.length-1;i>=0;i--){var q=particles[i];q.life+=dt;q.vy+=q.g*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.rv)q.rot+=q.rv*dt;if(q.life>q.max)particles.splice(i,1);}
  for(i=floaters.length-1;i>=0;i--){floaters[i].t+=dt;if(floaters[i].t>floaters[i].dur)floaters.splice(i,1);}
  for(i=bubbles.length-1;i>=0;i--){bubbles[i].t+=dt;if(bubbles[i].t>bubbles[i].dur)bubbles.splice(i,1);}
  for(i=shots.length-1;i>=0;i--){var s=shots[i];s.t+=dt;if(s.t>=s.dur){if(s.hit)s.hit();shots.splice(i,1);}}
  if(banner){banner.t+=dt;if(banner.t>2.2)banner=null;}
  if(santa.splat>0)santa.splat-=dt;
  updateCritters(dt);
  ambientT-=dt;if(ambientT<=0){ambientEvent();ambientT=rand(3.5,7.5);}
  // gnome acts
  for(i=0;i<pins.length;i++){var g=pins[i],a=g.act;if(!a)continue;a.t+=dt;
    if(a.type==='snowball'&&!a.fired&&a.t>a.dur*.55&&phase!=='title'){a.fired=true;var gs=gnomeScreen(g),sq=P(santa.x,SANTA_Y);Snd.whoosh();
      shots.push({x0:gs.x,y0:gs.y-gs.h*.7,x1:sq.x-70+rand(-20,20),y1:sq.y-150+rand(-30,30),t:0,dur:.55,r0:4,r1:16,arc:90,hit:function(){Snd.splat();santa.splat=3;var z=P(santa.x,SANTA_Y);puff(z.x-70,z.y-150,10);say(z.x-70,z.y-250,pick(['Oof!','Brrr!','Hey!!','Cold! COLD!']),1.4);}});}
    if(a.type==='sleep'&&a.t>0&&Math.floor(a.t/1.6)!==Math.floor((a.t-dt)/1.6)){var z2=gnomeScreen(g);floaters.push({x:z2.x+10,y:z2.y-z2.h,text:'z',t:0,dur:1.5,size:14+Math.random()*8,color:'#cfe6ff'});if(Math.random()<.15)Snd.snore();}
    if(a.type==='laugh'&&a.t>0&&Math.random()<dt*1.2){var z3=gnomeScreen(g);floaters.push({x:z3.x+rand(-10,10),y:z3.y-z3.h,text:pick(['HA','HEE','HO']),t:0,dur:.9,size:13,color:'#fff'});}
    if(a.t>a.dur)g.act=null;}
  pinsVisual(dt);
  // santa animation clock
  if(santa.mode==='throw'||santa.mode==='kid'){santa.t+=dt/(santa.mode==='kid'?1.7:0.9);
    if(!santa.released&&santa.t>=(santa.mode==='kid'?0.7:0.6)){santa.released=true;launch();}
    if(santa.t>=1){santa.mode='watch';santa.t=0;}}
  else santa.t+=dt;

  var acting=pins.some(function(g){return g.act;});
  var physics=false;
  switch(phase){
    case 'title':
      anticT-=dt;if(anticT<=0&&!acting){randomAntic();anticT=rand(1.5,3.5);}
      break;
    case 'position':
      var mv=(keys.ArrowRight||keys.d||keys.D?1:0)-(keys.ArrowLeft||keys.a||keys.A?1:0);
      if(mv){santa.tx=clamp(santa.tx+mv*26*dt,-SANTA_MAX,SANTA_MAX);idleT=0;}
      idleT+=dt;
      if(idleT>14&&!acting){var S=standing();if(S.length){startAntic('sleep',S,600);Snd.snore();}}
      // fallthrough to antic timer
    case 'aim':case 'power':
      if(phase==='aim'){aimPh+=dt*SPEED[diff].aim;shot.aim=Math.sin(aimPh);}
      if(phase==='power'){powPh+=dt*SPEED[diff].pow;shot.power=.5-.5*Math.cos(powPh);}
      anticT-=dt;if(anticT<=0&&!acting){randomAntic();anticT=rand(3.5,7);}
      break;
    case 'roll':
      physics=true;
      if(ball&&ball.done){phase='settle';pt=0;Snd.rollStop();}
      break;
    case 'settle':
      physics=true;
      var slow=pins.every(function(p){return p.state!=='down'||(Math.hypot(p.vx,p.vy)<5&&p.z===0);});
      if((pt>0.8&&slow)||pt>2.8)resolveRoll();
      break;
    case 'react':

  if(diff==='easy'){c.save();c.setLineDash([6,9]);c.strokeStyle='rgba(255,210,63,.7)';c.lineWidth=3;c.beginPath();var a=P(x0,3);c.moveTo(a.x,a.y);c.lineTo(t.x,t.y);c.stroke();c.restore();}
  // landing spot on the lane
  c.save();c.strokeStyle='#7a3b00';c.lineWidth=5;c.beginPath();c.ellipse(t.x,t.y-6,15,5,0,0,TAU);c.stroke();
  c.strokeStyle=act?'#ffd23f':'#ff9f1c';c.lineWidth=2.5;c.beginPath();c.ellipse(t.x,t.y-6,15,5,0,0,TAU);c.stroke();c.restore();
  // the arrow
  c.beginPath();c.moveTo(x,tipY);c.lineTo(x-hw,tipY-hh);c.lineTo(x-w/2,tipY-hh);c.lineTo(x-w/2,tipY-hh-sh);c.lineTo(x+w/2,tipY-hh-sh);c.lineTo(x+w/2,tipY-hh);c.lineTo(x+hw,tipY-hh);c.closePath();
  c.save();c.translate(3,4);c.fillStyle='rgba(0,0,0,.3)';c.fill();c.restore();
  c.fillStyle=act?'#ffd23f':'#ff9f1c';c.fill();c.strokeStyle='#7a3b00';c.lineWidth=4;c.lineJoin='round';c.stroke();
}
function drawBubble(b){
  var c=ctx,k=Math.min(1,b.t*8)*Math.min(1,(b.dur-b.t)*5);if(k<=0)return;
  c.save();c.globalAlpha=k;c.font='bold 15px '+FONT;var w=c.measureText(b.text).width+20,x=clamp(b.x,w/2+6,W-w/2-6),y=Math.max(96,b.y);
  c.fillStyle='#fff';rr(c,x-w/2,y-30,w,26,11);c.fill();c.strokeStyle='#223';c.lineWidth=2;c.stroke();
  poly(c,[x-6,y-5,x+6,y-5,x,y+6],'#fff');line(c,x-6,y-4,x,y+6,'#223',2);line(c,x+6,y-4,x,y+6,'#223',2);
  txt(c,b.text,x,y-16,15,'#223');c.restore();
}
function drawLights(){
  var c=ctx,cols=['#ff3b3b','#ffd23f','#3ddc84','#4dabf7','#ff7ae5'],wl=P(-31,238),wr=P(31,238),wt=wl.y-62,i,n=16;
  c.strokeStyle='rgba(20,40,20,.8)';c.lineWidth=1.5;c.beginPath();
  for(i=0;i<=n;i++){var x=lerp(wl.x,wr.x,i/n),y=wt+16+Math.sin(i/n*Math.PI*4)*4;if(i)c.lineTo(x,y);else c.moveTo(x,y);}c.stroke();
  for(i=0;i<=n;i++){var x2=lerp(wl.x,wr.x,i/n),y2=wt+19+Math.sin(i/n*Math.PI*4)*4,on=((i+Math.floor(time*2.5))%3)!==0,col=cols[i%5];
    if(on){c.globalAlpha=.35;ell(c,x2,y2,8,8,col);c.globalAlpha=1;}ell(c,x2,y2,3.2,4,on?col:'#555');}
  // workshop roof lights
  for(i=0;i<10;i++){var u=i/9,rx=lerp(44,276,u),ry=178-(1-Math.abs(u-.5)*2)*70+8,on2=((i+Math.floor(time*2))%2)===0;
    if(on2){c.globalAlpha=.4;ell(c,rx,ry,6,6,cols[i%5]);c.globalAlpha=1;}ell(c,rx,ry,2.5,3,on2?cols[i%5]:'#666');}
  // chimney smoke
  for(i=0;i<5;i++){var k=((time*.25+i/5)%1);c.globalAlpha=(1-k)*.35;ell(c,225+Math.sin(k*5+i)*8+k*14,96-k*56,6+k*12,5+k*9,'#dfe6ff');}
  c.globalAlpha=1;
}

// ───────────────────────── render ─────────────────────────
function render(){
  var c=ctx,i;buttons.length=0;
  if(bgDirty)paintBG();
  c.setTransform(1,0,0,1,0,0);c.drawImage(bgc,0,0);c.setTransform(scale,0,0,scale,0,0);
  if(cr.shoot){var s=cr.shoot,k=s.t/.9;c.save();c.globalAlpha=1-k;line(c,s.x+k*160,s.y+k*50,s.x+k*160-50,s.y+k*50-16,'#fff',2);c.restore();}
  if(cr.flyer)drawFlyer();
  drawLights();
  drawSnowman();
  drawReindeer(cr.rl);drawReindeer(cr.rr);
  if(cr.bird&&false)drawBird(0,0);
  // depth-sorted lane objects
  var list=[];
  for(i=0;i<pins.length;i++)list.push({y:pins[i].y,k:0,o:pins[i]});
  if(ball&&!ball.done)list.push({y:ball.y,k:1});
  if(cr.penguin)list.push({y:cr.penguin.y,k:2});
  if(phase!=='title')list.push({y:SANTA_Y,k:3});
  list.sort(function(a,b){return b.y-a.y;});
  var showArrow=(phase==='aim'||phase==='power'||phase==='throw');
  for(i=0;i<list.length;i++){var it=list[i];
    if(it.k===0)drawGnome(it.o);
    else if(it.k===1){var q=P(ball.x,ball.y),r=BALL_R*S0*q.s;c.fillStyle='rgba(20,50,110,.3)';c.beginPath();c.ellipse(q.x+3,q.y+r*.2,r,r*.3,0,0,TAU);c.fill();
      c.save();if(ball.gutter)c.globalAlpha=.8;drawBall(c,q.x,q.y-r*(ball.gutter?.55:.9),r,ball.rot);c.restore();}
    else if(it.k===2)drawPenguin();
    else drawSanta();
  }
  if(showArrow)drawArrow();
  drawBunny();
  // snowball shots
  for(i=0;i<shots.length;i++){var sh=shots[i],u=sh.t/sh.dur;ell(c,lerp(sh.x0,sh.x1,u),lerp(sh.y0,sh.y1,u)-Math.sin(u*Math.PI)*sh.arc,lerp(sh.r0,sh.r1,u),lerp(sh.r0,sh.r1,u),'#fff');}
  // particles
  for(i=0;i<particles.length;i++){var p=particles[i];c.globalAlpha=clamp(1-p.life/p.max,0,1);
    if(p.shape==='c')ell(c,p.x,p.y,p.size,p.size,p.color);else if(p.shape==='star')star(c,p.x,p.y,p.size,p.color,p.rot);
    else{c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.color;c.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);c.restore();}}
  c.globalAlpha=1;
  // snow
  c.fillStyle='#fff';for(i=0;i<snow.length;i++){var f=snow[i];c.globalAlpha=f.a;c.beginPath();c.arc(f.x,f.y,f.r,0,TAU);c.fill();}c.globalAlpha=1;
  for(i=0;i<floaters.length;i++){var fl=floaters[i],fk=fl.t/fl.dur;c.globalAlpha=1-fk;txt(c,fl.text,fl.x+Math.sin(fk*6)*4,fl.y-fk*36,fl.size,fl.color,{stroke:'rgba(0,0,40,.6)',sw:3});}c.globalAlpha=1;
  for(i=0;i<bubbles.length;i++)drawBubble(bubbles[i]);

  if(phase==='title'){drawTitle();}
  else{
    drawScoreboard();drawPowerBar();
    var msg=null;
    if(phase==='position')msg='① Move Santa left / right — click to set his spot';
    else if(phase==='aim')msg='② Click to lock your aim';
    else if(phase==='power')msg='③ Click to set your power!';
    if(msg){var pul=1+Math.sin(time*5)*.02;c.save();c.translate(480,92);c.scale(pul,pul);txt(c,msg,0,0,19,'#fff',{stroke:'rgba(5,10,50,.85)',sw:5});c.restore();}
    var F=frames[Math.min(fi,9)];
    txt(c,(diff==='easy'?'EASY':'HARD')+'  •  Frame '+(Math.min(fi,9)+1)+'  •  Score '+totalScore(),14,626,13,'#fff',{align:'left',stroke:'rgba(5,10,50,.8)',sw:4});
    // menu button
    c.fillStyle='rgba(0,0,0,.4)';rr(c,10,10,64,28,8);c.fill();txt(c,'MENU',42,25,12,'#fff');addBtn(10,10,64,28,function(){Snd.click();toTitle();});
    if(banner){var bt=banner.t,bs=bt<.25?lerp(.2,1.15,bt/.25):bt<.35?lerp(1.15,1,(bt-.25)/.1):1,al=bt>1.8?1-(bt-1.8)/.4:1;
      c.save();c.globalAlpha=al;c.translate(480,banner.small?140:150);c.scale(bs,bs);c.rotate(Math.sin(time*6)*.02);
      txt(c,banner.text,0,0,banner.small?40:66,banner.color,{font:HEAVY,stroke:'#14204a',sw:banner.small?8:12});c.restore();}
    if(phase==='gameover')drawGameOver();
  }
  // mute button
  c.fillStyle='rgba(0,0,0,.4)';rr(c,W-56,10,46,28,8);c.fill();
  c.fillStyle='#fff';poly(c,[W-45,21,W-39,21,W-32,15,W-32,35,W-39,29,W-45,29]);c.fill();
  if(Snd.muted){line(c,W-27,19,W-17,31,'#ff6b6b',2.5);line(c,W-17,19,W-27,31,'#ff6b6b',2.5);}
  else{c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.arc(W-31,25,6,-.8,.8);c.stroke();c.beginPath();c.arc(W-31,25,11,-.8,.8);c.stroke();}
  addBtn(W-56,10,46,28,function(){Snd.toggle();});
}
function drawTitle(){
  var c=ctx;
  c.save();c.translate(480,74);c.rotate(Math.sin(time*1.5)*.015);
  txt(c,'GNOME BOWLING',0,0,78,'#e63946',{font:HEAVY,stroke:'#fff',sw:14});txt(c,'GNOME BOWLING',0,0,78,'#e63946',{font:HEAVY,stroke:'#7a0f18',sw:4});
  c.restore();
  txt(c,'at Santa’s Workshop',480,132,24,'#fff',{stroke:'#14204a',sw:6});
  c.fillStyle='rgba(10,18,60,.82)';rr(c,215,345,530,262,18);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
  txt(c,'HOW TO PLAY',480,370,17,'#ffd23f');
  var L=['①  Move Santa left / right, then click to set his spot','②  Click to lock the aim arrow above the gnomes','③  Click to stop the power bar — top is full power','Under 20% power = a two-handed KIDDIE ROLL!'];
  for(var i=0;i<L.length;i++)txt(c,L[i],480,397+i*23,15,i===3?'#9be7ff':'#fff');
  txt(c,'Choose your difficulty:',480,497,15,'#ffd23f');
  button(275,512,190,56,'EASY','#2a9d4a',function(){Snd.click();startGame('easy');});
  button(495,512,190,56,'HARD','#d62828',function(){Snd.click();startGame('hard');});
  txt(c,'Slow arrow & bar'+(best.easy?'  •  Best '+best.easy:''),370,585,12,'#cfe6ff');
  txt(c,'Fast arrow & bar'+(best.hard?'  •  Best '+best.hard:''),590,585,12,'#cfe6ff');
  txt(c,'Mouse / touch, or keys: ← → move • Space select • M mute',480,626,12,'#fff',{stroke:'rgba(5,10,50,.8)',sw:4});
}
function drawGameOver(){
  var c=ctx,k=smooth(Math.min(1,pt*2.5)),tot=totalScore();
  c.save();c.globalAlpha=k;c.fillStyle='rgba(5,8,30,.5)';c.fillRect(0,70,W,H-70);
  c.fillStyle='rgba(10,18,60,.92)';rr(c,250,150,460,330,20);c.fill();c.strokeStyle='#fff';c.lineWidth=3;c.stroke();
  txt(c,'GAME OVER',480,196,44,'#ffd23f',{font:HEAVY,stroke:'#7a0f18',sw:6});
  txt(c,'Final score',480,244,18,'#cfe6ff');txt(c,''+tot,480,296,76,'#fff',{font:HEAVY,stroke:'#e63946',sw:6});
  var rank=tot>=250?'North Pole LEGEND!':tot>=200?'Sleigh-Team Captain!':tot>=150?'Top of the Nice List!':tot>=100?'Jolly good bowling!':tot>=60?'Not bad for a guy in mittens.':'The gnomes are still laughing…';
  txt(c,rank,480,350,19,'#9be7ff');
  txt(c,(tot>=best[diff]&&tot>0?'★ New best on '+diff.toUpperCase()+'! ★':'Best on '+diff.toUpperCase()+': '+best[diff]),480,378,14,'#ffd23f');
  c.restore();
  if(pt>.5){button(285,404,190,54,'PLAY AGAIN','#2a9d4a',function(){Snd.click();startGame(diff);},20);button(485,404,190,54,'MENU','#3a5fb0',function(){Snd.click();toTitle();},20);}
}

// ───────────────────────── boot ─────────────────────────
for(var i=0;i<150;i++)snow.push({x:rand(0,W),y:rand(0,H),r:rand(.8,3),v:rand(25,80),w:rand(.5,1.6),p:rand(0,6),d:rand(8,26),a:rand(.45,.95)});
resize();toTitle();
// offline support when served from a website (does nothing when opened as a local file)
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
var last=0;
function loop(ts){var dt=Math.min(0.05,(ts-last)/1000||0);last=ts;update(dt);render();requestAnimationFrame(loop);}
requestAnimationFrame(loop);

// small hook for automated testing / tuning
window.__gnomeBowling={
  tune:function(o){if(o.BM)BM=o.BM;if(o.K!=null)KNOCK_T=o.K;if(o.D!=null)DOWN_R=o.D;if(o.F)PFR=o.F;if(o.E)PP_E=o.E;},
  antic:function(type,n){var S=standing();startAntic(type,S.slice(0,n||S.length),3.2);},
  state:function(){return {phase:phase,frame:fi,frames:frames,score:totalScore(),standing:standing().length,aim:shot.aim,power:shot.power,santa:santa.x,diff:diff};},
  sim:function(x,aim,power){var sv=[pins,ball,particles];simMode=true;newRack(false);particles=[];var kid=power<.2,sp=kid?44+power*90:60+power*135,m=aim*AIM_MAX,n=Math.hypot(m,1);
    ball={x:x,y:1,vx:sp*m/n,vy:sp/n,rot:0,gutter:false,done:false,kid:kid,wob:0,t:0,gx:0};
    for(var i=0;i<240*8;i++)physStep(1/240);var k=10-standing().length;pins=sv[0];ball=sv[1];particles=sv[2];simMode=false;return k;}
};
})();
